spring:
  config:
    import: optional:classpath:joutio-defaults.yml
  application:
    name: joutio-bff
  profiles:
    default: local

  servlet:
    multipart:
      # Upload d'images (couvertures/questions/bannières) : marge au-dessus de la limite applicative
      # `joutio.media.max-file-size` (5 Mo) pour que le refus soit un ProblemDetail typé, pas un 413 Tomcat.
      max-file-size: 6MB
      max-request-size: 8MB

  flyway:
    locations: classpath:db/migration/bff

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

microservice:
  swagger:
    description: Joutio BFF - facade unique REST + WebSocket (services headless)
  websocket:
    enabled: true

# Fan-out temps réel multi-réplique : chaque pod BFF ne connaît que ses propres clients STOMP et
# doit consommer TOUS les événements de ces groupes (processors suffixés par instance via le SDK,
# token initial à la queue du flux — aucun replay Kafka). Le Web Push reste sur le groupe global
# `notification-push` (une seule notification OS, quel que soit le nombre de répliques).
joutio:
  room-presence:
    # Sortie d'un salon après une connexion fermée (une reconnexion pendant la grâce garde la présence).
    disconnect-grace: ${JOUTIO_ROOM_PRESENCE_DISCONNECT_GRACE:10s}
  expo-push:
    enabled: ${JOUTIO_EXPO_PUSH_ENABLED:false}
    access-token: ${JOUTIO_EXPO_PUSH_ACCESS_TOKEN:}
  identity:
    # Appels serveur-à-serveur limités aux OTP de suppression de compte.
    url: ${JOUTIO_IDENTITY_URL:http://joutio-identity}
  # Fuseau de découpage des jours d'activité (aligné sur `joutio-profile`).
  activity:
    zone: ${JOUTIO_ACTIVITY_ZONE:Europe/Paris}
  # Quotas de création de duels, gratuit / Premium (`DuelLimitPolicy`) ; salons bot identiques
  # pour tous. 0 = illimité.
  duel:
    limits:
      pending-challenges: ${JOUTIO_DUEL_MAX_PENDING_CHALLENGES:5}
      open-rooms: ${JOUTIO_DUEL_MAX_OPEN_ROOMS:5}
      premium-pending-challenges: ${JOUTIO_DUEL_PREMIUM_MAX_PENDING_CHALLENGES:20}
      premium-open-rooms: ${JOUTIO_DUEL_PREMIUM_MAX_OPEN_ROOMS:20}
      bot-rooms: ${JOUTIO_DUEL_MAX_BOT_ROOMS:5}
  # Plafonds de création, gratuit / Premium (`TopicCreationLimitPolicy`). 0 = illimité.
  creation:
    limits:
      published-topics: ${JOUTIO_CREATION_MAX_PUBLISHED_TOPICS:1}
      premium-published-topics: ${JOUTIO_CREATION_PREMIUM_MAX_PUBLISHED_TOPICS:10}
      questions-per-topic: ${JOUTIO_CREATION_MAX_QUESTIONS_PER_TOPIC:30}
      premium-questions-per-topic: ${JOUTIO_CREATION_PREMIUM_MAX_QUESTIONS_PER_TOPIC:150}
  # Compte : la date de naissance est exigée des comptes créés à partir de cet instant (ISO-8601) ; vide = jamais.
  account:
    birth-date-required-since: ${JOUTIO_BIRTH_DATE_REQUIRED_SINCE:}
  # Liens universels go.joutio.com (design/specs/screens/partage.md).
  share:
    web-url: ${JOUTIO_SHARE_WEB_URL:https://app.joutio.com}
    app-store-url: ${JOUTIO_SHARE_APP_STORE_URL:https://apps.apple.com/app/joutio}
    android-package: ${JOUTIO_SHARE_ANDROID_PACKAGE:com.joutio.app}
    apple-app-ids: ${JOUTIO_SHARE_APPLE_APP_IDS:}
    android-sha256: ${JOUTIO_SHARE_ANDROID_SHA256:}
    default-image: ${JOUTIO_SHARE_DEFAULT_IMAGE:https://joutio.com/og.png}
  axon:
    instance-scoped-groups:
      - game-notification
      - room-notification
      - matchmaking-notification
      - presence-notification
      - follow-presence-notification
      - achievement-notification
      - notification-ws
      # Purge des caches de lecture sur chaque réplique (follows, profil) : Éditions/follows sont
      # traités par un pod, tous les autres doivent invalider leur Caffeine local.
      - cache-invalidation
